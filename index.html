<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Árvore da Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--bg:#EDF0F6;--surface:#FFFFFF;--ink:#13203B;--muted:#56627C;--line:#C5CEDF;--azul:#1D4C9C;--on-azul:#FFFFFF;--ouro:#B5841E;--erro:#9B2335;--shield:#F7F9FD}
@media (prefers-color-scheme: dark){:root{--bg:#0E1526;--surface:#162038;--ink:#E7ECF7;--muted:#9BA7C2;--line:#2B3858;--azul:#8DB0F2;--on-azul:#0E1526;--ouro:#E3B95B;--erro:#FF9AA8;--shield:#1B2A4A;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.55 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.box{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 26px 26px}
.arms{width:40px;height:48px;display:block;margin-bottom:12px}
h1{margin:0 0 6px;font:700 26px/1.15 "Libre Caslon Text",Georgia,serif}
p{margin:0 0 16px;color:var(--muted)}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=password]{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
input[type=password]:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
.rem{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font-size:14px;color:var(--muted)}
button{appearance:none;cursor:pointer;width:100%;padding:11px 14px;font:inherit;font-weight:700;color:var(--on-azul);background:var(--azul);border:0;border-radius:8px}
button:disabled{opacity:.6;cursor:progress}
.err{margin:12px 0 0;color:var(--erro);font-size:14px;min-height:1.4em}
</style>
</head>
<body>
<main class="box">
  <svg class="arms" viewBox="0 0 44 52" aria-hidden="true">
    <defs><clipPath id="shp"><path d="M3 3h38v25c0 12-9 19-19 23C12 47 3 40 3 28z"/></clipPath></defs>
    <path d="M3 3h38v25c0 12-9 19-19 23C12 47 3 40 3 28z" fill="var(--shield)"/>
    <g clip-path="url(#shp)" fill="var(--azul)"><rect x="0" y="21" width="44" height="8"/><circle cx="14" cy="12" r="3.8"/><circle cx="30" cy="12" r="3.8"/><circle cx="22" cy="38" r="3.8"/></g>
    <circle cx="22" cy="25" r="3.4" fill="var(--ouro)"/>
    <path d="M3 3h38v25c0 12-9 19-19 23C12 47 3 40 3 28z" fill="none" stroke="var(--azul)" stroke-width="1.6"/>
  </svg>
  <h1>Árvore da Família</h1>
  <p>Esta página é só para a família. Abra pelo link que foi mandado no grupo, ou digite a senha aqui.</p>
  <form id="f" autocomplete="on">
    <label for="pw">Senha</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <label class="rem"><input id="rem" type="checkbox" checked> Lembrar neste aparelho</label>
    <button id="go" type="submit">Entrar</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>

function b64(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function unlock(pw){
  var raw = b64(PAYLOAD), salt = raw.slice(8, 16), ct = raw.slice(16);
  var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  var bits = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:salt, iterations:ITER, hash:"SHA-256"}, km, 384));
  var key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  var pt = await crypto.subtle.decrypt({name:"AES-CBC", iv:bits.slice(32, 48)}, key, ct);
  var txt = new TextDecoder().decode(pt);
  if (txt.indexOf("ARVORE|") !== 0) throw new Error("senha");
  return txt.slice(7);
}
function show(html){ document.open(); document.write(html); document.close(); }
async function tryPw(pw, remember){
  var btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try {
    var html = await unlock(pw);
    try { if (remember) localStorage.setItem(KEY, pw); } catch (e) {}
    show(html); return true;
  } catch (e) {
    btn.disabled = false;
    err.textContent = (window.crypto && crypto.subtle) ? "Senha incorreta. Confira a mensagem do grupo e tente de novo." : "Este navegador não consegue abrir a página. Tente o Chrome ou o Safari atualizado.";
    return false;
  }
}
document.getElementById("f").addEventListener("submit", function(e){ e.preventDefault(); tryPw(document.getElementById("pw").value, document.getElementById("rem").checked); });
(function(){
  var k = null, s = null;
  try { k = new URLSearchParams(location.hash.slice(1)).get("k"); } catch (e) {}
  try { s = localStorage.getItem(KEY); } catch (e) {}
  function limpaLink(){ try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
  if (k){
    tryPw(k, true).then(function(ok){ if (ok) { limpaLink(); return; } document.getElementById("err").textContent = "Esse link está com a senha errada. Peça o link de novo no grupo."; });
  } else if (s){
    tryPw(s, true).then(function(ok){ if (!ok) { try { localStorage.removeItem(KEY); } catch (e) {} document.getElementById("err").textContent = ""; } });
  }
})();
